<!DOCTYPE html>
<html lang="en">
<head>
    <title> Student Profile </title>
</head>
<body>
    <h1>Hello {{name}}</h1>
    {% if topper %}
    <p><b>YOU ARE A TOPPER!!</b></p>
    {% else %}
    <p><b>YOU STILL ARE BETTER!!</b></p>
    {% endif %}

    <h2>Your Subjects : </h2>
    <ul>
        {% for subject in subjects %}
        <li>{{subject}}</li>
        {% endfor %}
    </ul>
</body>
</html>
